ul{list-style:none;margin:0 0 18px;padding:0}

.v span,.v small{color:var(--mute);font-size:13px}.fb{height:5px;background:var(--line);border-radius:3px}.fb i{display:block;height:100%;background:var(--c);border-radius:3px}.v .pill{align-self:flex-start}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.col h3{margin:0 0 8px;font-size:14px;color:var(--c)}
.tc{background:var(--panel);border-radius:10px;padding:11px;margin-bottom:8px;font-size:14px}.tc small{display:block;color:var(--mute);margin-top:3px}
.bay{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:10px}.bar{height:12px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ---- structure: sticky header, sheet, backdrop ---- */
body.dm canvas{visibility:hidden}
#dash .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.9),transparent 38%),radial-gradient(circle at 88% 22%,color-mix(in srgb,var(--acc) 32%,transparent),transparent 46%),linear-gradient(180deg,#bfe4fb 0%,#e6f3f7 55%,#fdf0d8 100%)}

#dash{background:none}.rail,#dash main{position:relative;z-index:1}
#dash main{display:flex;flex-direction:column}
.dh3{position:sticky;top:0;z-index:5;margin:calc(-18px - env(safe-area-inset-top,0px)) -28px 20px;padding:calc(14px + env(safe-area-inset-top,0px)) 28px 14px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1.5px solid rgba(255,255,255,.85);box-shadow:0 8px 24px rgba(16,48,58,.12)}

function closeModal() {
  const overlay = $('#modal-overlay');
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
  activeModalModule = null;
  editingRecordId = null;
  isSubmitting = false;
}

function handleFormSubmit(e) {
  e.preventDefault();
  if (isSubmitting) return;
  isSubmitting = true;

  const btn = $('#form-save-btn');
  if (btn) {
    btn.disabled = true;
    btn.innerText = 'Saving…';
  }

  setTimeout(() => {
    const modKey = activeModalModule;
    if (modKey === 'fleet') {
      const id = $('#f-id').value.trim();
      const m = $('#f-m').value.trim();
      const p = $('#f-p').value.trim();
      const t = $('#f-t').value;
      const b = $('#f-b').value;
      const s = $('#f-s').value;

      if (editingRecordId) {
        const item = DB.fleet.find(x => x.id === editingRecordId);
        if (item) Object.assign(item, { m, p, t, b, s });
      } else {
        DB.fleet.unshift({ id, m, p, t, b, s });
      }
    } else if (modKey === 'drivers') {
      const name = $('#f-name').value.trim();
      const lic = $('#f-lic').value.trim();
      const phone = $('#f-phone').value.trim();
      const exp = $('#f-exp').value;
      const status = $('#f-status').value;

      if (editingRecordId) {
        const item = DB.drivers.find(x => x.id === editingRecordId);
        if (item) Object.assign(item, { name, lic, phone, exp, status });
      } else {
        const newId = 'DRV-' + String(DB.drivers.length + 1).padStart(2, '0');
        DB.drivers.unshift({ id: newId, name, lic, phone, exp, status, vehicle: '—', tripsToday: 0 });
      }
    } else if (modKey === 'trips') {
      const id = $('#f-id').value.trim();
      const vehicle = $('#f-vehicle').value;
      const driver = $('#f-driver').value;
      const origin = $('#f-origin').value.trim();
      const dest = $('#f-dest').value.trim();
      const datetime = $('#f-datetime').value;
      const status = $('#f-status').value;

      if (editingRecordId) {
        const item = DB.trips.find(x => x.id === editingRecordId);
        if (item) Object.assign(item, { vehicle, driver, origin, dest, datetime, status });
      } else {
        DB.trips.unshift({ id, vehicle, driver, origin, dest, datetime, status });
      }
    } else if (modKey === 'garage') {
      const vehicle = $('#f-vehicle').value;
      const type = $('#f-type').value.trim();
      const desc = $('#f-desc').value.trim();
      const date = $('#f-date').value;
      const tech = $('#f-tech').value.trim();
      const cost = parseFloat($('#f-cost').value) || 0;
      const status = $('#f-status').value;

      if (editingRecordId) {
        const item = DB.garage.find(x => x.id === editingRecordId);
        if (item) Object.assign(item, { vehicle, type, desc, date, tech, cost, status });
      } else {
        const newId = 'MNT-' + String(DB.garage.length + 1).padStart(2, '0');
        DB.garage.unshift({ id: newId, vehicle, type, desc, date, tech, cost, status, progress: 0 });
      }
    } else if (modKey === 'fuel') {
      const vehicle = $('#f-vehicle').value;
      const driver = $('#f-driver').value;
      const date = $('#f-date').value;
      const liters = parseFloat($('#f-liters').value) || 0;
      const price = parseFloat($('#f-price').value) || 61.4;
      const odo = parseInt($('#f-odo').value) || 0;
      const station = $('#f-station').value.trim();

      if (editingRecordId) {
        const item = DB.fuel.find(x => x.id === editingRecordId);
        if (item) Object.assign(item, { vehicle, driver, date, liters, price, odo, station });
      } else {
        const newId = 'FUL-' + String(DB.fuel.length + 1).padStart(2, '0');
        DB.fuel.unshift({ id: newId, vehicle, driver, date, liters, price, odo, station, note: 'Normal' });

    } else if (modKey === 'hq') {

function deleteRecord(modKey, id) {
  if (confirm(`Are you sure you want to delete record ${id}?`)) {
    DB[modKey] = DB[modKey].filter(x => x.id !== id);
    showToast(`Record ${id} deleted`);
    route();
  }
}

function viewRecordDetails(modKey, id) {
  const rec = DB[modKey].find(x => x.id === id);
  if (!rec) return;

  const overlay = $('#modal-overlay');
  $('#modal-title').innerText = `View Record (${id})`;

  let details = '<div style="display:grid;gap:8px;font-size:14px;">';
  Object.entries(rec).forEach(([k, v]) => {
    details += `<div><strong style="text-transform:capitalize">${k}:</strong> ${v}</div>`;
  });
  details += '</div><div class="modal-actions"><button type="button" class="btn p" onclick="closeModal()">Close</button></div>';

  $('#modal-body').innerHTML = details;
  overlay.classList.add('active');
}

// Filter, Search and Pagination Helpers
function filterDataset(modKey) {
  const st = TSTATE[modKey];
  let data = DB[modKey] || [];

  if (st.search) {
    const q = st.search.toLowerCase();
    data = data.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(q)));
  }

  if (st.filter && st.filter !== 'ALL') {
    data = data.filter(item => {
      if (item.s !== undefined) return item.s === st.filter;
      if (item.status !== undefined) return item.status === st.filter;
      if (item.branch !== undefined) return item.branch === st.filter;
      return true;
    });
  }

  return data;
}

function renderTablePaginationControls(modKey, totalRecords) {
  const st = TSTATE[modKey];
  const totalPages = Math.max(1, Math.ceil(totalRecords / st.limit));
  st.page = Math.min(st.page, totalPages);

  const start = totalRecords === 0 ? 0 : (st.page - 1) * st.limit + 1;
  const end = Math.min(totalRecords, st.page * st.limit);

  return `
    <div class="tbl-footer">
      <div>Showing <strong>${start}–${end}</strong> of <strong>${totalRecords}</strong> matching records</div>
      <div class="pg-btns">
        <button class="pg-btn" ${st.page <= 1 ? 'disabled' : ''} onclick="TSTATE['${modKey}'].page--;route()">← Prev</button>
        <span>Page ${st.page} of ${totalPages}</span>
        <button class="pg-btn" ${st.page >= totalPages ? 'disabled' : ''} onclick="TSTATE['${modKey}'].page++;route()">Next →</button>
      </div>
    </div>`;
}

// KPI Calculators
function getModuleKPIs(id) {
  if (id === 'fleet') {
    const total = DB.fleet.length;
    const avail = DB.fleet.filter(x => x.s === '0').length;
    const trip = DB.fleet.filter(x => x.s === '1').length;
    const service = DB.fleet.filter(x => x.s === '2').length;
    return [
      ['Total vehicles', total],
      ['Available', avail, `${Math.round((avail/total||0)*100)}% ready`, '#047857'],
      ['On trip', trip],
      ['In service', service]
    ];
  } else if (id === 'drivers') {
    const total = DB.drivers.length;
    const shift = DB.drivers.filter(x => x.status === 'On shift').length;
    const avail = DB.drivers.filter(x => x.status === 'Available').length;
    const off = DB.drivers.filter(x => x.status === 'Off today').length;
    return [
      ['Total Drivers', total],
      ['On shift', shift],
      ['Available', avail],
      ['Off today', off]
    ];
  } else if (id === 'trips') {
    const active = DB.trips.filter(x => x.status === 'On route').length;
    const sched = DB.trips.filter(x => x.status === 'Scheduled').length;
    const delay = DB.trips.filter(x => x.status === 'Delayed').length;
    const comp = DB.trips.filter(x => x.status === 'Completed').length;
    return [
      ['Active Trips', active],
      ['Scheduled', sched],
      ['Delayed', delay, delay > 0 ? 'Requires attention' : 'On schedule', delay > 0 ? '#b91c1c' : '#047857'],
      ['Completed', comp]
    ];
  } else if (id === 'garage') {
    const bay = DB.garage.filter(x => x.status === 'In bay').length;
    const due = DB.garage.filter(x => x.status === 'Due' || x.status === 'Scheduled').length;
    const overdue = DB.garage.filter(x => x.status === 'Overdue').length;
    const totalCost = DB.garage.reduce((acc, curr) => acc + (curr.cost || 0), 0);
    return [
      ['In bay', bay],
      ['Pending / Due', due],
      ['Overdue', overdue, overdue > 0 ? 'High priority' : 'All clear', overdue > 0 ? '#b91c1c' : '#047857'],
      ['Total Cost', `₱${Math.round(totalCost/1000)}k`]
    ];
  } else if (id === 'fuel') {
    const refuels = DB.fuel.length;
    const volume = DB.fuel.reduce((acc, c) => acc + (c.liters || 0), 0);
    const spend = DB.fuel.reduce((acc, c) => acc + ((c.liters || 0) * (c.price || 61.4)), 0);
    return [
      ['Total Refuels', refuels],
      ['Volume Total', `${Math.round(volume)} L`],
      ['Avg Economy', '8.4 km/L'],
      ['Total Spend', `₱${Math.round(spend/1000)}k`]
    ];
  } else if (id === 'hq') {
    const emp = DB.hq.length;
    const active = DB.hq.filter(x => x.status === 'Active').length;
    return [
      ['Branches', '3'],
      ['On-time rate', '94%'],
      ['Total Staff', emp],
      ['Active Staff', active]
    ];
  }
  return MODS[id].stats;
}

function bumpIdle(){clearTimeout(idle);if(SESSION)idle=setTimeout(()=>logout('You were signed out after a period of inactivity.'),CFG.idleMs)}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,bumpIdle,{passive:true}));
async function applyPrefs(){try{const p=await A.settingsGet('appearance');document.body.classList.toggle('rm',p.motion==='on')}catch(e){}}
async function hydrate(){for(const k of Object.keys(MODS)){if(k==='settings')continue;try{const[s,l]=await Promise.all([A.summary(k),A.list(k,{page:1,limit:4})]);MODS[k].stats=s.slice(0,4).map(x=>[x[0],x[1]]);
 MODS[k].rows=l.rows.map(r=>[esc(`${r.id} \u00b7 ${r.name||r.vehicle||r.type||r.m||r.origin||''}`),r.status||r.s||'\u2014',stc(r.status||r.s)]);
 const sp=pins[k]&&pins[k].querySelector('span');if(sp)sp.textContent=`${s[0][1]} ${String(s[0][0]).toLowerCase()}`}catch(e){}}}
/* ---- data loading ---- */
window.filterDataset=m=>{const c=CACHE[m]||{rows:[],total:0};return{length:c.total,slice:()=>c.rows}};
window.getModuleKPIs=id=>(CACHE[id]&&CACHE[id].summary)||[['Loading','\u2026'],['Loading','\u2026'],['Loading','\u2026'],['Loading','\u2026']];
function reload(h,now){if(h==='settings')return;clearTimeout(tmr);tmr=setTimeout(async()=>{const c=CACHE[h]=CACHE[h]||{rows:[],raw:[],total:0},my=++seq,st=TSTATE[h];c.loading=true;c.error=null;
 try{const[l,s]=await Promise.all([A.list(h,{page:st.page,limit:st.limit,search:st.search,filter:st.filter}),A.summary(h)]);if(my!==seq)return;Object.assign(c,{rows:l.rows,raw:l.raw||l.rows,total:l.total,summary:s});DB[h]=c.raw}catch(e){if(my!==seq)return;c.error=e.message}c.loading=false;if(DASH&&last===h)draw(h)},now?0:220)}
/* ---- rendering ---- */
const _page=window.page;
function draw(h){const om=$('#dash main'),sc=om&&last===h?om.scrollTop:0,ae=document.activeElement,fk=ae&&ae.closest&&ae.closest('.tbl-search')?ae:null,pos=fk?fk.selectionStart:0;
 DASH=true;dd=0;document.body.classList.add('dm');last=h;$('#dash').innerHTML=_page(h);$('#dash').classList.add('on');post(h);
 if(sc)$('#dash main').scrollTop=sc;if(fk){const n=$('#dash .tbl-search input');if(n){n.focus();n.setSelectionRange(pos,pos)}}}
function post(h){const hr=$('#dash .hr'),c=CACHE[h];if(hr){const b=document.createElement('button');b.className='btn out';b.textContent='Log out';b.onclick=()=>logout();hr.appendChild(b)}
 const add=$('#dash .add-rec');if(add&&(h==='settings'||!can('write')))add.remove();if(!can('delete'))document.querySelectorAll('#dash .act-btn.del').forEach(x=>x.remove());
 const note=$('#dash .note');if(note)note.textContent=MOCK?'Demo data held in memory for this session. Not connected to PostgreSQL.':'';
 if(h==='settings'){$('#dash .sheet').innerHTML='';renderSettings();return}
 const cell=$('#dash td[colspan]');if(cell&&c){if(c.loading||!c.rows.length&&!c.error&&!c.summary)cell.textContent='Loading records\u2026';else if(c.error)cell.innerHTML=`${esc(c.error)} <button class="act-btn" onclick="route()">Retry</button>`}
 if(c&&c.error&&!cell)$('#dash .sheet').insertAdjacentHTML('afterbegin',`<div class="ferr" role="alert">${esc(c.error)}</div>`)}
window.page=id=>_page(id);
const _route=window.route;removeEventListener('hashchange',_route);
window.route=function(){if(!SESSION){showLogin();return}
 const h=location.hash.slice(1),f=h.startsWith('hub-')&&MODS[h.slice(4)]&&h.slice(4)!=='settings'?h.slice(4):null;
 if(MODS[h]){draw(h);reload(h)}else{DASH=false;document.body.classList.remove('dm');$('#dash').classList.remove('on');if(f)focus(f);else if(last){focus(last);Object.assign(g,{tx:0,ty:0,tz:0,r:HUB.r,ph:HUB.ph});if(reduce)Object.assign(c,g)}last=null}};
addEventListener('hashchange',window.route);
/* ---- forms: no ID fields, dropdowns from backend lookups ---- */
const FIELDS={fleet:{m:'f-m',p:'f-p',t:'f-t',b:'f-b',s:'f-s'},drivers:{name:'f-name',lic:'f-lic',phone:'f-phone',exp:'f-exp',status:'f-status'},trips:{vehicle:'f-vehicle',driver:'f-driver',origin:'f-origin',dest:'f-dest',datetime:'f-datetime',status:'f-status'},garage:{vehicle:'f-vehicle',type:'f-type',desc:'f-desc',date:'f-date',tech:'f-tech',cost:'f-cost',status:'f-status'},fuel:{vehicle:'f-vehicle',driver:'f-driver',date:'f-date',liters:'f-liters',price:'f-price',odo:'f-odo',station:'f-station'},hq:{name:'f-name',username:'f-username',role:'f-role',branch:'f-branch',status:'f-status'}};
const _open=window.openAddForm;
window.openAddForm=function(m,id){_open(m,id);const rec=(id&&DB[m].find(x=>x.id===id))||{},fid=$('#f-id');if(fid)fid.closest('.f-group').remove();
 const S=(i,o,v)=>{const el=$('#'+i);if(el)el.innerHTML=(v?'':'<option value="">Select\u2026</option>')+(o||[]).map(x=>`<option value="${esc(x.value)}"${x.value==v?' selected':''}>${esc(x.label)}</option>`).join('')};
 const st=(LK.status&&LK.status[m]||[]).map(v=>({value:v,label:v}));
 S('f-s',st,rec.s);S('f-status',st,rec.status);S('f-t',LK.vehicleTypes,rec.t);S('f-b',LK.branches,rec.b);S('f-branch',LK.branches,rec.branch);S('f-vehicle',LK.vehicles,rec.vehicle);S('f-driver',LK.drivers,rec.driver);
 if(LK.error||!LK.status){const b=$('#form-save-btn');if(b)b.disabled=true;$('#mod-form').insertAdjacentHTML('afterbegin',`<div class="ferr full" role="alert">Dropdown options could not be loaded from the server (${esc(LK.error||'no data')}). Saving is disabled.</div>`)}};
window.handleFormSubmit=async function(e){e.preventDefault();if(isSubmitting)return;const form=$('#mod-form');let ok=true;
 form.querySelectorAll('.f-group').forEach(gr=>{const i=gr.querySelector('input,select,textarea'),bad=i&&!i.checkValidity();gr.classList.toggle('has-err',!!bad);if(bad)ok=false});if(!ok){showToast('Please complete the required fields');return}
 isSubmitting=true;const btn=$('#form-save-btn');btn.disabled=true;btn.textContent='Saving\u2026';const mod=activeModalModule,eid=editingRecordId,p={};
 for(const[k,i]of Object.entries(FIELDS[mod])){const el=$('#'+i);if(el)p[k]=el.type==='number'?parseFloat(el.value):el.value.trim()}
 try{const r=eid?await A.update(mod,eid,p):await A.create(mod,p);closeModal();showToast(eid?`Record ${eid} updated`:`Record created. ID: ${r.id}`);reload(mod,true);hydrate()}
 catch(er){isSubmitting=false;btn.disabled=false;btn.textContent='Save Record';$('#mod-form .ferr')&&$('#mod-form .ferr').remove();$('#mod-form').insertAdjacentHTML('afterbegin',`<div class="ferr full" role="alert">${esc(er.message)}</div>`)}};
window.deleteRecord=async function(m,id){if(!can('delete'))return showToast('You are not allowed to delete records');if(!confirm(`Delete record ${id}? This cannot be undone.`))return;
 try{await A.remove(m,id);showToast(`Record ${id} deleted`);reload(m,true);hydrate()}catch(er){showToast(er.message)}};
/* ---- settings ---- */
const TABS=[['profile','My Profile'],['security','Security'],['notif','Notifications'],['appear','Appearance'],['users','User Management',1],['branches','Branch Management',1],['sysconf','System Configuration',1],['logs','Activity Logs',1]];
window.setTab=t=>{stab=t;renderSettings()};
const F=(id,l,t,v,x='')=>`<div class="full" style="grid-column:auto"><label for="s-${id}">${l}</label><input id="s-${id}" type="${t}" value="${esc(v)}" ${x}></div>`;
const T=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
async function renderSettings(){const box=$('#dash .sheet');if(!box)return;const tabs=TABS.filter(t=>!t[2]||can('admin'));if(!tabs.some(t=>t[0]===stab))stab='profile';
 box.innerHTML=`<h2 class="sh">Settings</h2><div class="chips">${tabs.map(t=>`<button class="chip${stab===t[0]?' a':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="card" id="sb"><p class="sm">Loading\u2026</p></div>`;
 const b=$('#sb'),my=stab;let h='';
 try{if(stab==='profile')h=`<form class="sform" id="sf">${F('name','Display name','text',SESSION.name)}${F('email','Email','email',SESSION.email||'')}<p class="sm full">Username: ${esc(SESSION.username)} \u00b7 Role: ${esc(SESSION.role)}</p><div><button class="btn p" type="submit">Save profile</button></div></form>`;
 else if(stab==='security')h=`<form class="sform" id="sf">${F('cur','Current password','password','','autocomplete="current-password"')}${F('new','New password (min 8 characters)','password','','autocomplete="new-password"')}${F('con','Confirm new password','password','','autocomplete="new-password"')}<div><button class="btn p" type="submit">Change password</button></div></form>`;
 else if(stab==='notif'){const n=await A.settingsGet('notif');h=`<form id="sf">${[['overdue','Overdue maintenance'],['delayed','Delayed trips'],['licence','Driver licence expiring']].map(x=>`<label class="tg"><input type="checkbox" id="s-${x[0]}" ${n[x[0]]?'checked':''}>${x[1]}</label>`).join('')}<br><button class="btn p" type="submit">Save notifications</button></form>`}
 else if(stab==='appear'){const p=await A.settingsGet('appearance');h=`<form class="sform" id="sf"><div class="full"><label for="s-motion">Reduce motion</label><select id="s-motion"><option value="system"${p.motion==='system'?' selected':''}>Follow device setting</option><option value="on"${p.motion==='on'?' selected':''}>Always reduce</option></select></div><div><button class="btn p" type="submit">Save preferences</button></div></form>`}
 else if(stab==='users')h=T(['Name','Username','Role','Status'],await A.admin('users'));
 else if(stab==='branches')h=T(['Branch','Description','Manager'],await A.admin('branches'));
 else if(stab==='logs')h=T(['Time','User','Action','Target'],await A.admin('logs'));
 else if(stab==='sysconf'){const s=await A.settingsGet('system');h=`<form class="sform" id="sf">${F('fuelPrice','Default fuel price per litre','number',s.fuelPrice,'step="0.01" min="0" required')}${F('serviceKm','Service interval (km)','number',s.serviceKm,'min="1" required')}${F('idleMin','Idle sign-out (minutes)','number',s.idleMin,'min="1" required')}${F('licenceDays','Licence warning (days)','number',s.licenceDays,'min="1" required')}<div><button class="btn p" type="submit">Save configuration</button></div></form>`}
 if(my!==stab)return;b.innerHTML=h+(['users','branches','sysconf','logs'].includes(stab)?'<p class="sm">Administrator-only. The backend must also enforce this permission.</p>':'');const f=$('#sf');if(f)f.onsubmit=ev=>saveSet(ev)}
 catch(er){b.innerHTML=`<div class="ferr" role="alert">${esc(er.message)}</div>`}}
async function saveSet(ev){ev.preventDefault();const btn=ev.submitter||$('#sf button'),old=btn.textContent;btn.disabled=true;btn.textContent='Saving\u2026';const v=i=>{const e=$('#s-'+i);return e?(e.type==='checkbox'?e.checked:e.value):''};
 try{if(stab==='security'){if(!v('cur')||v('new').length<8)throw new Error('Enter your current password and a new password of at least 8 characters.');if(v('new')!==v('con'))throw new Error('The new passwords do not match.');if(v('new')===v('cur'))throw new Error('Choose a different password from the current one.');await A.changePassword(v('cur'),v('new'));$('#sf').reset()}
 else if(stab==='profile'){if(!v('name').trim())throw new Error('Display name is required.');await A.settingsSave('profile',{name:v('name').trim(),email:v('email')});SESSION.name=v('name').trim()}
 else if(stab==='notif')await A.settingsSave('notif',{overdue:v('overdue'),delayed:v('delayed'),licence:v('licence')});
 else if(stab==='appear'){await A.settingsSave('appearance',{motion:v('motion')});document.body.classList.toggle('rm',v('motion')==='on')}
 else if(stab==='sysconf'){if(!$('#sf').checkValidity())throw new Error('Check the highlighted values.');await A.settingsSave('system',{fuelPrice:+v('fuelPrice'),serviceKm:+v('serviceKm'),idleMin:+v('idleMin'),licenceDays:+v('licenceDays')})}
 showToast('Saved')}catch(er){showToast(er.message)}btn.disabled=false;btn.textContent=old}
/* ---- boot ---- */
$('#load')&&($('#load').style.display='none');
A.me().then(u=>u?start(u):showLogin()).catch(()=>showLogin());
})();
  </script>
